name: Conformance

on:
  pull_request:
    paths:
      - "shims/**"
      - "suite/**"
      - "src/**"
      - "results/**"
      - ".github/workflows/conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shim: [any-llm, litellm, pydantic-ai, vercel-ai]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shims/js/*/package-lock.json
      - run: uv run wiretruth envs --build "${{ matrix.shim }}"
      # The install above needs the network; the run doesn't. Replay needs only loopback, and blocking
      # other networking prevents live provider requests. The runner, replay server and shim share this
      # network namespace. The sysctl allows the namespace on Ubuntu 24.04 and changes only this
      # throwaway runner. Grades are compared with the committed results for this library version.
      - run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn sh -c 'ip link set lo up && exec .venv/bin/wiretruth run --lib "$1" \
            --check-against' sh "${{ matrix.shim }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance-${{ matrix.shim }}
          path: .wiretruth/runs/
          include-hidden-files: true
          retention-days: 7
