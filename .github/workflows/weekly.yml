name: weekly

# Two jobs: `run` installs and grades new releases without credentials, then hands a bundle to
# `open-pr`. Only `open-pr` holds the PAT, in the main-only `weekly` environment. Using a PAT to
# open the results PR lets its CI run.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.weekly.outputs.changed }}
      date: ${{ steps.weekly.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.21"
          enable-cache: false
      - run: uv sync --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check pins and grade releases
        id: weekly
        run: uv run --no-sync python -m wiretruth.weekly --out "$RUNNER_TEMP/weekly"
      - name: Hand results to the PR job
        if: ${{ !cancelled() && steps.weekly.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weekly
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: weekly-runs-${{ github.run_attempt }}
          path: .wiretruth/runs/
          include-hidden-files: true
          retention-days: 7

  open-pr:
    needs: run
    if: ${{ !cancelled() && needs.run.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: weekly
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: weekly-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weekly
      - name: Push and open the results PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WT_BOT_TOKEN }}
          WEEKLY_DATE: ${{ needs.run.outputs.date }}
        run: |
          artifact="$RUNNER_TEMP/weekly"
          # The date comes from the job that ran the new releases; accept only a date.
          [[ "$WEEKLY_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Bad date: $WEEKLY_DATE" >&2; exit 1; }
          git bundle verify "$artifact/weekly.bundle"
          git fetch "$artifact/weekly.bundle" weekly:weekly
          allowed='^(results/[a-z0-9][a-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9.+_-]*\.json|shims/(python|js)/[a-z0-9][a-z0-9._-]*/(wiretruth-shim\.json|package\.json|package-lock\.json)|CHANGELOG\.md)$'
          git diff --no-renames --name-status HEAD weekly > "$RUNNER_TEMP/weekly-paths"
          while IFS=$'\t' read -r status path; do
            if [[ ! "$status" =~ ^[AM]$ || ! "$path" =~ $allowed ]]; then
              echo "Rejected bundle path: $status $path" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/weekly-paths"
          branch="results/weekly-${WEEKLY_DATE}-${GITHUB_RUN_ID}"
          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "weekly:refs/heads/${branch}"
          args=(--base main --head "$branch" --title "chore(results): weekly run ${WEEKLY_DATE}" \
            --body-file "$artifact/pr-body.md")
          if [ -f "$artifact/blocked" ]; then args+=(--label blocked); fi
          url=$(gh pr create "${args[@]}")
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
