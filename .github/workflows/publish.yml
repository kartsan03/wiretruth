name: Publish

# A version tag (v0.1.0) builds the sdist and wheel and publishes them to PyPI with trusted publishing: PyPI
# accepts this workflow's OIDC token for the `pypi` environment, so no PyPI token is stored here. A manual run
# publishes only when started on a tag (`gh workflow run publish.yml --ref v0.1.0`), for example to retry.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
      - run: uv build
      # A tag that doesn't match wiretruth.__version__ stops here, before anything is uploaded.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: test -f "dist/wiretruth-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
