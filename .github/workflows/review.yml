name: Review

# The maintainer comments "/review" on a pull request or an issue. On a pull request, "/review" is one reviewer
# agent that cannot start others. "/review max" is the full review at maximum effort: six reviewer agents, a gap
# pass and a verifier per finding, which costs several times more; use it for workflow or security changes and
# large or risky pull requests. On a pull request from someone without write access, the comment must also name
# the full 40-character SHA of the head commit that was checked; the gate's replies print the command to paste. A
# short prefix gets a reply but no review, because a commit pushed after the comment can be crafted to share it.
# Every comment starts this workflow; the gate job ignores the rest.
# The maintainer can also start it from the Actions tab or with
# `gh workflow run review.yml [--ref <branch>] -f number=<n> [-f command="/review max"]`, which is how changes to
# this workflow get tested on a branch before they are merged. Such a run takes the workflow, the review criteria and
# the base/ snapshot from that branch instead of main. It also has no inline-comment tool (the action adds it only for
# pull request events), so every finding goes into the summary.
#
# issue_comment runs with repository secrets even for pull requests from forks. So all GitHub access happens
# in the workflow's own steps, the pull request's code is checked out outside the repository's worktree and
# never run, and the reviewer can only read files and post inline comments. Its instructions come from
# .github/review/ on main, never from the pull request.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request or issue number
        required: true
        type: number
      command:
        description: The command, written as it would be commented
        required: false
        default: /review
        type: string

permissions: {}

defaults:
  run:
    shell: bash

env:
  REVIEW_MODEL: claude-sonnet-5-5
  REVIEW_DIR: /home/runner/review
  NUMBER: ${{ github.event.issue.number || inputs.number }}
  REPO: ${{ github.repository }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'kartsan03') ||
      (startsWith(github.event.comment.body, '/review') &&
      github.event.comment.user.login == 'kartsan03' &&
      github.event.issue.state == 'open')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      kind: ${{ steps.check.outputs.kind }}
      effort: ${{ steps.check.outputs.effort }}
      head: ${{ steps.check.outputs.head }}
      base: ${{ steps.check.outputs.base }}
      outside: ${{ steps.check.outputs.outside }}
    steps:
      - name: Check the command and the pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body || inputs.command }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          say() { gh api "repos/$REPO/issues/$NUMBER/comments" -f body="$1" > /dev/null; }
          stop() { echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; }
          command=$(printf '%s' "$BODY" | tr -d '\r' | sed -e 's/[[:space:]]*$//')
          [[ "$command" =~ ^/review(\ max)?(\ ([0-9a-f]{7,40}))?$ ]] || stop
          effort=high
          [ -n "${BASH_REMATCH[1]}" ] && effort=max
          vetted=${BASH_REMATCH[3]}
          issue=$(gh api "repos/$REPO/issues/$NUMBER")
          [ "$(jq -r .state <<< "$issue")" = open ] || stop
          kind=issue head="" base="" outside=false
          if [ "$(jq -r '.pull_request != null' <<< "$issue")" = true ]; then
            kind=pr
            pr=$(gh api "repos/$REPO/pulls/$NUMBER")
            head=$(jq -r .head.sha <<< "$pr")
            base=$(jq -r .base.sha <<< "$pr")
            author=$(jq -r .user.login <<< "$pr")
            [[ "$head" =~ ^[0-9a-f]{40}$ && "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unexpected SHAs"; exit 1; }
            permission=$(gh api "repos/$REPO/collaborators/$author/permission" --jq .permission 2> /dev/null || echo none)
            case "$permission" in write | admin) ;; *) outside=true ;; esac
            if [ "$outside" = true ] && [ -z "$vetted" ]; then
              say "This pull request comes from an outside contributor. After checking the diff, comment \`/review $head\` (or \`/review max $head\`) to review exactly that commit."
              stop
            fi
            if [ -n "$vetted" ] && [ "${#vetted}" -ne 40 ]; then
              say "A short SHA isn't accepted. The pull request's head is ${head:0:7}; after checking that commit, comment \`/review $head\`."
              stop
            fi
            if [ -n "$vetted" ] && [ "$head" != "$vetted" ]; then
              say "The pull request's head is now ${head:0:7}, not ${vetted:0:7}. Check the new commits, then comment \`/review $head\`."
              stop
            fi
          fi
          if [ -n "$COMMENT_ID" ]; then
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null || true
          fi
          {
            echo "ok=true"
            echo "kind=$kind"
            echo "effort=$effort"
            echo "head=$head"
            echo "base=$base"
            echo "outside=$outside"
          } >> "$GITHUB_OUTPUT"

  review:
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.gate.outputs.effort == 'max' && 60 || 40 }}
    concurrency:
      group: review-${{ github.event.issue.number || inputs.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
    env:
      KIND: ${{ needs.gate.outputs.kind }}
      EFFORT: ${{ needs.gate.outputs.effort }}
      HEAD_SHA: ${{ needs.gate.outputs.head }}
      BASE_SHA: ${{ needs.gate.outputs.base }}
      OUTSIDE: ${{ needs.gate.outputs.outside }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the pull request
        if: env.KIND == 'pr'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.head }}
          path: pr
          persist-credentials: false

      # Inputs live outside the worktree, which the action may switch to the pull request's head.
      - name: Prepare review inputs
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refuse() { echo "$1" > "$RUNNER_TEMP/refusal"; echo "::error::$1"; exit 1; }
          mkdir -p "$REVIEW_DIR"
          if [ "$KIND" = pr ]; then
            mv pr "$REVIEW_DIR/pr"
            [ "$(git -C "$REVIEW_DIR/pr" rev-parse HEAD)" = "$HEAD_SHA" ] || refuse "Checked out the wrong commit."
            # Outside contributors may not change agent configuration. Paths are NUL-separated, so no quoting.
            if [ "$OUTSIDE" = true ]; then
              config='(^|/)(CLAUDE\.md|CLAUDE\.local\.md|AGENTS\.md|\.mcp\.json)$|(^|/)\.claude/'
              while IFS= read -r -d '' path; do
                [ "$(git -C "$REVIEW_DIR/pr" rev-parse "HEAD:$path")" = "$(git rev-parse -q --verify "HEAD:$path" || true)" ] ||
                  refuse "This pull request changes agent configuration files (CLAUDE.md, AGENTS.md, .claude/ or .mcp.json). Review it by hand."
              done < <(git -C "$REVIEW_DIR/pr" ls-tree -r -z --name-only HEAD | { grep -zEi "$config" || true; })
            fi
            mkdir "$REVIEW_DIR/base"
            git archive HEAD | tar -x -C "$REVIEW_DIR/base"
            gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" -H "Accept: application/vnd.github.diff" > "$REVIEW_DIR/pr.diff"
            gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | {name, status, conclusion, url: .html_url}' | jq -s . > "$REVIEW_DIR/checks.json"
            gh pr view "$NUMBER" --repo "$REPO" \
              --json title,body,author,baseRefName,headRefName,isCrossRepository,additions,deletions,commits \
              > "$REVIEW_DIR/pr.json"
            template=.github/review/pull-request.md
            if [ "$EFFORT" = max ]; then template=.github/review/pull-request-max.md agents=true; fi
          else
            gh issue view "$NUMBER" --repo "$REPO" --json title,body,author,labels,milestone,comments \
              > "$REVIEW_DIR/issue.json"
            template=.github/review/issue.md
          fi
          echo "agents=${agents:-false}" >> "$GITHUB_OUTPUT"
          delimiter="PROMPT_$(openssl rand -hex 16)"
          {
            echo "prompt<<$delimiter"
            sed -e "s|{{NUMBER}}|$NUMBER|g" -e "s|{{HEAD_SHA}}|$HEAD_SHA|g" -e "s|{{DIR}}|$REVIEW_DIR|g" "$template"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # The action fetches the live pull request head and may switch the worktree to it. This hook makes
      # that fail unless it lands on the commit the gate resolved.
      - name: Pin the worktree to the vetted commit
        if: env.KIND == 'pr'
        run: |
          git checkout --quiet --detach
          git for-each-ref --format='%(refname:short)' refs/heads/ | xargs -r git branch --quiet -D
          hook="$(git rev-parse --git-path hooks)/reference-transaction"
          cat > "$hook" << EOF
          #!/bin/sh
          [ "\$1" = prepared ] || exit 0
          while read -r old new ref; do
            case "\$ref:\$new" in
              refs/heads/*:$HEAD_SHA | HEAD:$HEAD_SHA | HEAD:ref:refs/heads/*) ;;
              refs/heads/* | HEAD:*)
                echo "::error::The pull request changed after the gate resolved it. Comment /review again." >&2
                exit 1
                ;;
            esac
          done
          EOF
          chmod +x "$hook"

      - name: Review
        id: review
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        env:
          CLAUDE_CODE_EFFORT_LEVEL: ${{ env.EFFORT }}
          CLAUDE_CODE_SUBAGENT_MODEL: ${{ env.REVIEW_MODEL }}
          CLAUDE_CODE_SUBAGENT_MODEL_FORCE: "1"
          # Claude Code's own small background calls (such as the session title) use this model, not Haiku.
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ env.REVIEW_MODEL }}
          # Subagents run in the foreground, so their results are in before the summary. In the background the
          # session ended with the reviewers still running.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          # Subagent messages go into the transcript too, so the model of every subagent turn can be checked.
          CLAUDE_CODE_FORWARD_SUBAGENT_TEXT: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: >-
            --model ${{ env.REVIEW_MODEL }}
            --effort ${{ env.EFFORT }}
            --max-turns ${{ env.KIND == 'pr' && 100 || 50 }}
            --add-dir ${{ env.REVIEW_DIR }}
            --tools "${{ steps.prep.outputs.agents == 'true' && 'Read,Grep,Glob,Agent,ToolSearch' || 'Read,Grep,Glob,ToolSearch' }}"
            --allowedTools "${{ steps.prep.outputs.agents == 'true' && 'Read,Grep,Glob,Agent,' || 'Read,Grep,Glob,' }}mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "${{ steps.prep.outputs.agents != 'true' && 'Agent,' || '' }}Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch"
          settings: >-
            {"permissions": {"blockReadsOutsideWorkingDirectories": true,
            "deny": ["Read(//proc/**)", "Read(//home/runner/work/_temp/**)", "Read(**/.git/**)",
            "Read(//home/runner/**/.git/**)"]},
            "claudeMdExcludes": ["**/CLAUDE.md", "**/CLAUDE.local.md", "**/AGENTS.md", "**/.claude/rules/**"]}

      - name: Post the summary
        if: steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          summary="$RUNNER_TEMP/summary.md"
          jq -rs 'flatten | map(select(.type? == "result")) | last | .result // empty' "$EXECUTION_FILE" > "$summary"
          [ -s "$summary" ] || echo "The review finished without a summary." > "$summary"
          # The footer names the models that were actually billed and the number of agents started.
          models=$(jq -rs 'flatten | map(select(.type? == "result")) | last | .modelUsage // {} | keys | join(" + ")' \
            "$EXECUTION_FILE")
          agents=$(jq -rs '[.. | objects | select(.type? == "tool_use" and (.name? == "Agent" or .name? == "Task"))]
            | length' "$EXECUTION_FILE")
          commit=""
          [ "$KIND" = pr ] && commit=", commit ${HEAD_SHA:0:7}"
          printf '\n\n<sub>%s, effort %s, %s agents%s · [run](%s)</sub>\n<!-- wiretruth-review %s %s -->\n' \
            "${models:-unknown model}" "$EFFORT" "$agents" "$commit" "$RUN_URL" "$KIND" "${HEAD_SHA:-}" >> "$summary"
          gh api "repos/$REPO/issues/$NUMBER/comments" -F body=@"$summary" > /dev/null

      - name: Report models and tools used
        if: always() && steps.review.outcome != 'skipped'
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          echo "Worktree: $(git rev-parse HEAD) (vetted head: ${HEAD_SHA:-n/a})"
          echo "Models in the transcript:"
          jq -rs '[.. | objects | .model? | strings] | unique | .[]' "$EXECUTION_FILE" || true
          echo "Session settings:"
          jq -rs 'flatten | map(select(.type? == "system" and .subtype? == "init")) | first | {model, permissionMode, tools}' \
            "$EXECUTION_FILE" || true
          echo "Result:"
          jq -rs 'flatten | map(select(.type? == "result")) | last | {is_error, subtype, num_turns, duration_ms,
            models: (.modelUsage // {} | map_values({inputTokens, outputTokens, cacheReadInputTokens}))}' \
            "$EXECUTION_FILE" || true
          echo "Agents started:"
          jq -rs '.. | objects | select(.type? == "tool_use" and (.name? == "Agent" or .name? == "Task"))
            | .input | {description, subagent_type, model}' -c "$EXECUTION_FILE" || true
          # On a failed run the last assistant message holds the error (for example an authentication or usage
          # limit message), which the action doesn't print.
          if [ "${{ steps.review.outcome }}" != success ]; then
            echo "Last assistant message:"
            jq -rs 'flatten | map(select(.type? == "assistant") | .message.content[]? | select(.type? == "text") | .text)
              | last // "" | .[0:2000]' "$EXECUTION_FILE" || true
          fi

      - name: Report a failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reason="The review failed or timed out."
          [ -s "$RUNNER_TEMP/refusal" ] && reason=$(cat "$RUNNER_TEMP/refusal")
          gh api "repos/$REPO/issues/$NUMBER/comments" -f body="$reason Run: $RUN_URL" > /dev/null
