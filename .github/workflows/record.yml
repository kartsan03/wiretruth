name: record

# Records provider responses into fixtures and pushes them to a record/<provider>-<run id> branch.
# Open the pull request from that branch yourself (docs/recording.md): one created with
# GITHUB_TOKEN wouldn't run CI.
#
# Two jobs, so no step holds both credentials: `record` has the API key and a read-only token;
# `push` has a token that can push, and only the fixtures `record` handed over. The key is a secret
# of the `recording` environment, which only `main` may use, so it never runs with a branch's code.
# Ollama providers use a checksum-verified local server and need no API key.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: The wire API to record
        type: choice
        options: [openai-chat, openai-responses, ollama, ollama-openai]
        required: true
      scenarios:
        description: Comma-separated scenario ids or globs, such as tools.*,usage.*
        type: string
        required: true
      model:
        description: The model to request (empty for the provider's current one)
        type: string
        required: false
      replace:
        description: Overwrite existing fixtures instead of keeping them as dated variants
        type: boolean
        default: false

permissions:
  contents: read

env:
  # ollama/ollama v0.40.3 release asset: ollama-linux-amd64.tar.zst and its SHA-256.
  OLLAMA_VERSION: v0.40.3
  OLLAMA_SHA256: ce6f8b671a699bf1ebafb28d60dbbabf4f37b30b499145fa308a8ba72de021d6

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: recording
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: false # nothing cached by other runs reaches the step that holds the key
      - run: uv sync --locked

      - name: Start Ollama
        if: ${{ startsWith(inputs.provider, 'ollama') }}
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
        run: |
          if ! command -v zstd >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
          archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          curl --fail --location --retry 3 \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
            --output "$archive"
          echo "$OLLAMA_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/ollama"
          export PATH="$RUNNER_TEMP/ollama/bin:$PATH"
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:11434/api/version; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            tail -n 100 "$RUNNER_TEMP/ollama.log"
            exit 1
          fi
          ollama pull "${MODEL:-qwen3.5:0.8b}"

      # A scenario that fails doesn't stop the others; the step still fails, and the fixtures that
      # were written go on to lint and the push.
      - name: Record
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
          SCENARIOS: ${{ inputs.scenarios }}
          MODEL: ${{ inputs.model }}
          REPLACE: ${{ inputs.replace }}
          OPENAI_API_KEY: ${{ (inputs.provider == 'openai-chat' || inputs.provider == 'openai-responses') && secrets.OPENAI_API_KEY || '' }}
        run: |
          args=(--provider "$PROVIDER" --scenario "$SCENARIOS")
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          if [ "$REPLACE" = "true" ]; then args+=(--replace); fi
          uv run --no-sync wiretruth record "${args[@]}" 2>&1 | tee record.log

      - name: Lint the suite
        id: lint
        if: ${{ !cancelled() }}
        run: uv run --no-sync wiretruth lint

      - name: Look for new or changed fixtures
        id: changes
        if: ${{ !cancelled() && steps.lint.outcome == 'success' }}
        run: |
          if [ -n "$(git status --porcelain -- suite/fixtures)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the fixtures to the push job
        if: ${{ !cancelled() && steps.changes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixtures-${{ github.run_attempt }}
          path: suite/fixtures/
          if-no-files-found: error
          retention-days: 3

      - name: Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "## Recorded"
            echo
            echo '```text'
            cat record.log 2>/dev/null || echo "(no output)"
            echo '```'
            if [ -f "$RUNNER_TEMP/ollama.log" ]; then
              echo
              echo "## Ollama server log"
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/ollama.log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  push:
    needs: record
    if: ${{ !cancelled() && needs.record.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pushes the record/* branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fixtures-${{ github.run_attempt }}
          path: suite/fixtures/
      - name: Push the branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ inputs.provider }}
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          git add -- suite/fixtures
          # A re-run gets its own branch: the attempt number keeps it from colliding.
          branch="record/${PROVIDER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898273+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --message "feat(suite): record ${SCENARIOS} for ${PROVIDER}"
          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/${branch}"
          {
            echo "Pushed \`${branch}\`:"
            echo
            echo '```text'
            git show --stat --format= HEAD
            echo '```'
            echo
            echo "Check each fixture's truth against the wire, then open the pull request:"
            echo
            echo '```bash'
            echo "gh pr create --head ${branch} --fill"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
