[project]
name = "wiretruth"
dynamic = ["version"]
description = "Replays real LLM provider responses through LLM SDKs and checks whether each SDK reports what actually happened."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# 4.18 added the `referencing` registry that formats.py uses for $ref between the bundled schemas.
dependencies = ["jsonschema>=4.18"]
keywords = ["llm", "sdk", "conformance", "test-suite", "openai", "anthropic", "gemini", "ollama", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-jsonschema"]

[project.scripts]
wiretruth = "wiretruth.cli:main"

[project.urls]
Homepage = "https://kartsan03.github.io/wiretruth/"
Repository = "https://github.com/kartsan03/wiretruth"
Issues = "https://github.com/kartsan03/wiretruth/issues"
Changelog = "https://github.com/kartsan03/wiretruth/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "wiretruth.__version__" }

[tool.setuptools.package-data]
wiretruth = ["schemas/*.json", "site/templates/*.html", "site/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
